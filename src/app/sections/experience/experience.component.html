<section class="experience" id="experience">
  <h2>Experience</h2>

  <div class="timeline">
    <article class="exp-card" *ngFor="let item of experiences">
      <h3>{{ item.role }}</h3>
      <h4>{{ item.company }}</h4>
      <p class="period">{{ item.period }}</p>
      <p>{{ item.description }}</p>
    </article>
  </div>
</section>

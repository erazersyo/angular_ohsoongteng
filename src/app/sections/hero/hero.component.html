<section class="hero" id="home">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="hero-inner">

    <!-- Left: profile photo -->
    <div class="photo-col">
      <div class="photo-wrap">
        <div class="photo-glow"></div>
        <img src="assets/profile.jpg" alt="Oh Soong Teng" class="profile-img" />
      </div>
    </div>

    <!-- Right: text content -->
    <div class="content">
      <p class="greeting">{{ langService.t('hero.greeting') }}</p>
      <h1 class="name">{{ langService.t('hero.name') }}</h1>
      <p class="name-postfix" *ngIf="langService.t('hero.namePostfix')">{{ langService.t('hero.namePostfix') }}</p>
      <div class="role-line">
        <span class="role">{{ currentRole }}</span>
        <span class="cursor">|</span>
      </div>
      <p class="subtitle">{{ langService.t('hero.subtitle') }}</p>
      <div class="cta-buttons">
        <a [href]="resumeHref" target="_blank" rel="noopener" class="btn btn-primary">
          {{ langService.t('hero.viewResume') }}
        </a>
        <a href="#contact" class="btn btn-secondary">
          {{ langService.t('hero.getInTouch') }}
        </a>
      </div>
    </div>

  </div>

  <div class="scroll-hint">
    <span></span>
  </div>
</section>

<section class="skills" id="skills">
  <div class="section-header">
    <span class="section-label">{{ langService.t('skills.label') }}</span>
    <h2 class="section-title">
      {{ langService.t('skills.titleMain') }} <span>{{ langService.t('skills.titleHighlight') }}</span>
    </h2>
  </div>

  <div class="grid" [class.visible]="visible">
    <div
      class="skill-card"
      *ngFor="let skill of skills; let i = index"
      [style.--i]="i"
    >
      <div class="icon-wrap">
        <img [src]="skill.icon" [alt]="skill.name" />
      </div>
      <p>{{ skill.name }}</p>
    </div>
  </div>
</section>

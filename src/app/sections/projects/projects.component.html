<section class="projects" id="projects" [class.visible]="visible">
  <div class="section-header">
    <span class="section-label">{{ langService.t('projects.label') }}</span>
    <h2 class="section-title">
      {{ langService.t('projects.titleMain') }} <span>{{ langService.t('projects.titleHighlight') }}</span>
    </h2>
  </div>

  <div class="grid">
    <div
      class="project-card"
      appTilt
      *ngFor="let project of projects; let i = index"
      [style.--i]="i"
    >
      <div class="card-top">
        <svg class="folder-icon" width="34" height="34" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
            stroke="#915eff" stroke-width="1.5" fill="rgba(145,94,255,0.12)"
          />
        </svg>
        <div class="card-links">
          <a *ngIf="project.github" [href]="project.github" target="_blank" title="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.09.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.38 9.38 0 0112 6.84c.85.004 1.71.12 2.51.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.59.69.49C19.13 20.65 22 16.8 22 12.26 22 6.58 17.52 2 12 2z"/>
            </svg>
          </a>
          <a *ngIf="project.demo" [href]="project.demo" target="_blank" title="Live Demo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
      <h3>{{ langService.pick(project.title, project.titleJa) }}</h3>
      <p>{{ langService.pick(project.description, project.descriptionJa) }}</p>
      <div class="tech-tags">
        <span *ngFor="let t of project.tech">{{ t }}</span>
      </div>
    </div>
  </div>
</section>

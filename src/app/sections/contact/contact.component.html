<section class="contact" id="contact" [class.visible]="visible">
  <div class="section-header">
    <span class="section-label">Let's Talk</span>
    <h2 class="section-title">
      Get In<span>Touch</span>
    </h2>
    <p class="subtitle">Want to connect? I'd love to hear from you.</p>
  </div>

  <div class="contact-wrapper">
    <form class="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="name">{{ langService.t('contact.nameLabel') }}</label>
          <input id="name" type="text"
            [placeholder]="langService.t('contact.namePlaceholder')"
            [(ngModel)]="formData.name" name="name"
            [disabled]="status === 'sending'" />
        </div>
        <div class="form-group">
          <label for="email">{{ langService.t('contact.emailLabel') }}</label>
          <input id="email" type="email"
            placeholder="your@email.com"
            [(ngModel)]="formData.email" name="email"
            [disabled]="status === 'sending'" />
        </div>
      </div>
      <div class="form-group">
        <label for="message">{{ langService.t('contact.messageLabel') }}</label>
        <textarea id="message"
          placeholder="Your message..."
          [(ngModel)]="formData.message" name="message"
          [disabled]="status === 'sending'"></textarea>
      </div>

      <button type="submit" class="send-btn"
        [class.sending]="status === 'sending'"
        [class.success]="status === 'success'"
        [class.error]="status === 'error'"
        [disabled]="status === 'sending'">

        <!-- Idle -->
        <ng-container *ngIf="status === 'idle'">
          {{ langService.t('contact.sendBtn') }}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </ng-container>

        <!-- Sending -->
        <ng-container *ngIf="status === 'sending'">
          <span class="spinner"></span>
          Sending...
        </ng-container>

        <!-- Success -->
        <ng-container *ngIf="status === 'success'">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Message Sent!
        </ng-container>

        <!-- Error -->
        <ng-container *ngIf="status === 'error'">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Failed — Try Again
        </ng-container>

      </button>
    </form>

    <div class="social-links">
      <p class="or-text">{{ langService.t('contact.orText') }}</p>
      <div class="socials">
        <a href="https://github.com/erazersyo" target="_blank" rel="noopener noreferrer" class="social-card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.09.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.38 9.38 0 0112 6.84c.85.004 1.71.12 2.51.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.59.69.49C19.13 20.65 22 16.8 22 12.26 22 6.58 17.52 2 12 2z"/>
          </svg>
          GitHub
        </a>
        <a href="https://wa.me/8108085332824" target="_blank" rel="noopener noreferrer" class="social-card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.52 3.48A11.78 11.78 0 0012.04 0C5.51 0 .2 5.31.2 11.83c0 2.09.55 4.13 1.59 5.93L0 24l6.46-1.68c1.73.95 3.69 1.45 5.7 1.45h.01c6.53 0 11.84-5.31 11.84-11.83 0-3.16-1.23-6.13-3.49-8.46zM12.04 21.6c-1.76 0-3.48-.48-4.98-1.38l-.36-.21-3.83 1 1.02-3.72-.23-.38A9.72 9.72 0 012.2 11.83c0-5.38 4.38-9.76 9.84-9.76 2.62 0 5.09 1.02 6.94 2.87A9.68 9.68 0 0121.88 11.8c0 5.38-4.38 9.8-9.84 9.8zm5.42-7.32c-.29-.15-1.72-.85-1.99-.95-.27-.1-.47-.15-.67.15-.19.29-.74.95-.91 1.14-.17.19-.34.21-.63.07-.29-.15-1.22-.45-2.32-1.44-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.59.14-.14.29-.34.44-.52.15-.17.2-.29.29-.48.1-.19.05-.36-.02-.5-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.79.36-.27.29-1.02 1-1.02 2.44s1.05 2.82 1.2 3.01c.15.19 2.07 3.16 5.02 4.44.7.3 1.24.48 1.67.62.7.22 1.34.19 1.85.12.56-.08 1.72-.7 1.96-1.38.24-.68.24-1.26.17-1.38-.07-.12-.27-.19-.56-.34z"/>
          </svg>
          WhatsApp
        </a>
        <a href="https://www.linkedin.com/in/oh-soong-teng-2746651ab/" target="_blank" rel="noopener noreferrer" class="social-card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn
        </a>
        <a href="mailto:ohst33@gmail.com" class="social-card">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          {{ langService.t('contact.emailLink') }}
        </a>
      </div>
    </div>
  </div>

  <p class="footer-note">
    Built by <span>Oh Soong Teng</span> &middot; {{ year }}
  </p>
</section>
